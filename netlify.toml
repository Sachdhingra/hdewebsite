# Deploys the static lead-capture site in /site (Netlify, zero build step).
[build]
  publish = "site"
  command = ""

# Omniflow (HDE's CRM) reads the product catalogue and photos for quotations.
# They are public anyway; this only lets the CRM's browser fetch them.
[[headers]]
  for = "/assets/js/catalog.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/img/products/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The Diwali page became the wedding-season page after the festival (2026-11).
[[redirects]]
  from = "/diwali-furniture-dehradun.html"
  to = "/wedding-furniture-dehradun.html"
  status = 301

# Interio's grouped GINT338 page carried a stale price, so its colours now live on their own card (2026-11).
# Keeps salesperson links already shared (…gint338.html?ref=…) working.
[[redirects]]
  from = "/product/slimline-xl-3-door-steel-almirah-with-locker-and-drawer-gint338.html"
  to = "/product/slimxl3drldbawspn.html"
  status = 301
