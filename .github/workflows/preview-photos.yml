name: Fetch preview photos (temporary)

# One-off helper: downloads a few gallery photos so a product-page preview can be built offline. Remove once done.
on:
  push:
    paths:
      - .github/workflows/preview-photos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p preview-photos
          for u in https://interio.com/media/catalog/product/5/6/56121403sd00236_a2_1440x810.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56121403sd00236_01_1920x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56121403sd00236_02_960x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56121403sd00236_03_960x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56121403sd00236_04_1920x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/wysiwyg/56121403SD00236_Feature_01_680x600.jpg https://interio.com/media/wysiwyg/56121403SD00236_Feature_02_680x600.jpg https://interio.com/media/wysiwyg/56121403SD00236_Feature_03_680x600.jpg https://interio.com/media/wysiwyg/56121403SD00236_Feature_04_680x600.jpg https://interio.com/media/wysiwyg/56121403SD00236_Feature_05_680x600.jpg https://interio.com/media/catalog/product/5/6/56101515sd00298_a2_1440x810.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56101515sd00298_01_1920x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56101515sd00298_02_960x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56101515sd00298_03_960x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/catalog/product/5/6/56101515sd00298_04_1920x1080.jpg?optimize=high&bg-color=255,255,255&fit=bounds&width=900 https://interio.com/media/wysiwyg/56101515SD00298_Feature_01_680x600.jpg https://interio.com/media/wysiwyg/56101515SD00298_Feature_02_680x600.jpg https://interio.com/media/wysiwyg/56101515SD00298_Feature_03_680x600.jpg https://interio.com/media/wysiwyg/56101515SD00298_Feature_04_680x600.jpg; do
            n=$(echo "$u" | sed 's#?.*##; s#.*/##')
            curl -sSL -A "HomeDecorEnterprisesCatalogSync/1.0" -o "preview-photos/$n" "$u"
            sleep 0.5
          done
          ls preview-photos | wc -l
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add preview-photos
          git commit -m "Add temporary preview photos" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
