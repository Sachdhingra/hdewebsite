name: Fetch preview photos (temporary)

# One-off helper: downloads the first page of product photos per room so a
# preview with real photos can be built offline. Remove once the preview is done.
on:
  push:
    paths:
      - .github/workflows/preview-photos.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          src = open("site/assets/js/catalog.js", encoding="utf-8").read()
          body = src[src.index("products:") + len("products:"):]
          products = json.loads(body[:body.rindex("]") + 1])
          os.makedirs("preview-photos", exist_ok=True)
          per_room = {}
          for p in products:
              r = p["room"]
              if per_room.get(r, 0) >= 24 or not p.get("image") or "placeholder" in p["image"]:
                  continue
              per_room[r] = per_room.get(r, 0) + 1
              url = re.sub(r"width=\d+", "width=400", p["image"])
              req = urllib.request.Request(url, headers={"User-Agent": "HomeDecorEnterprisesCatalogSync/1.0"})
              try:
                  data = urllib.request.urlopen(req, timeout=30).read()
                  open(f"preview-photos/{p['id']}.jpg", "wb").write(data)
              except Exception as e:
                  print("failed", p["id"], e)
              time.sleep(0.5)
          print(per_room)
          PY
      - name: Commit photos
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add preview-photos
          git commit -m "Add temporary preview photos" || exit 0
          git push
