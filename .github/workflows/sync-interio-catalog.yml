name: Sync Interio catalogue

# Rebuilds site/assets/js/catalog.js and the per-product files in site/assets/data/products
# from interio.com product pages and commits them.
# Runs every Monday, on demand (Actions tab > Sync Interio catalogue > Run workflow),
# and whenever the scraper itself changes.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many products (0 = all)"
        default: "0"
      rooms:
        description: "Only these rooms, comma separated (blank = all): living,bedroom,kitchen,dining,office,storage"
        default: ""
  schedule:
    - cron: "30 1 * * 1"
  push:
    paths:
      - tools/scrape_interio.py
      - .github/workflows/sync-interio-catalog.yml

permissions:
  contents: write

concurrency:
  group: interio-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape interio.com
        run: |
          python3 tools/scrape_interio.py \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --rooms "${{ github.event.inputs.rooms || '' }}"
      - name: Commit catalogue if it changed
        run: |
          git add -A site/assets/js/catalog.js site/assets/data/products
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git commit -m "Sync Interio catalogue ($(date -u +%Y-%m-%d))"
          git push
