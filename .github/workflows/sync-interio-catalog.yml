name: Sync Interio catalogue

# Rebuilds site/assets/js/catalog.js and the per-product files in site/assets/data/products
# from interio.com product pages and commits them.
# The catalogue is too big to refresh in one run within the time limit, so it is split by room
# over three days (01:30 UTC = 7:00 AM in Dehradun). Each run refreshes only its rooms and keeps
# every other product as it is; a run that stops early never removes products it did not reach.
#   Monday:    bedroom
#   Tuesday:   storage, kitchen
#   Wednesday: living, dining, office
# Also runs on demand (Actions tab > Sync Interio catalogue > Run workflow) and whenever the
# scraper itself changes (then it refreshes today's rooms, or Monday's on other days).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Stop after this many products (0 = all)"
        default: "0"
      rooms:
        description: "Refresh only these rooms, comma separated (blank = today's rooms): living,bedroom,kitchen,dining,office,storage, or all"
        default: ""
  schedule:
    - cron: "30 1 * * 1"   # Monday: bedroom
    - cron: "30 1 * * 2"   # Tuesday: storage, kitchen
    - cron: "30 1 * * 3"   # Wednesday: living, dining, office
  push:
    paths:
      - tools/scrape_interio.py
      - tools/build_sitemap.py
      - tools/build_landing.py
      - tools/build_products.py
      - .github/workflows/sync-interio-catalog.yml

permissions:
  contents: write

concurrency:
  group: interio-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick the rooms for this run
        id: slice
        env:
          ROOMS_INPUT: ${{ github.event.inputs.rooms }}
        run: |
          rooms="$ROOMS_INPUT"
          if [ -z "$rooms" ]; then
            case "$(date -u +%u)" in
              2) rooms="storage,kitchen" ;;
              3) rooms="living,dining,office" ;;
              *) rooms="bedroom" ;;
            esac
          fi
          [ "$rooms" = "all" ] && rooms=""
          echo "rooms=$rooms" >> "$GITHUB_OUTPUT"
          echo "Refreshing rooms: ${rooms:-all}"
      - name: Scrape interio.com
        run: |
          python3 tools/scrape_interio.py \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --rooms "${{ steps.slice.outputs.rooms }}" \
            --max-minutes 170
      - name: Rebuild product pages, sitemap and Dehradun landing pages
        run: |
          python3 tools/build_products.py
          python3 tools/build_sitemap.py
          python3 tools/build_landing.py
      - name: Commit catalogue if it changed
        run: |
          git add -A site/sitemap.xml site/*-dehradun.html site/product site/assets/js/catalog.js site/assets/data/products site/assets/img/products site/assets/img/rooms
          if git diff --cached --quiet; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git commit -m "Sync Interio catalogue ($(date -u +%Y-%m-%d), ${{ steps.slice.outputs.rooms || 'all rooms' }})"
          # Site edits may have landed on the branch during the long scrape; the bot only
          # touches generated files, so replaying its commit on top is always clean.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
