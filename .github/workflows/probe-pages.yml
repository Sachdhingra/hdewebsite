name: Save sample Interio pages (temporary)

# One-off helper: saves a few product pages so parsing can be checked offline. Remove once done.
on:
  push:
    paths:
      - .github/workflows/probe-pages.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          i=0
          for u in https://interio.com/product/hero-queen-bed-foam-mattress-72-x-60-x-4-inches-56101508sd03945 https://interio.com/product/upmods-flowr-queen-size-engineered-wood-bed-with-box-storage-UPFLRQBOXB02 https://interio.com/product/jinerio-nx-1-seater-fabric-sofa-56101502sd01469 https://interio.com/product/slimline-2-door-with-2-shelves-mirror-and-ohu-GINT014 https://interio.com/product/aero-full-back-knitted-fabric-workstation-chair-56101522SD04692; do
            i=$((i+1))
            curl -sSL -A "HomeDecorEnterprisesCatalogSync/1.0" --compressed -o probe/p$i.html "$u"
            sleep 1
          done
          ls -la probe
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add probe
          git commit -m "Add temporary sample pages" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
