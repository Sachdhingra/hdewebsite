name: Save sample Interio pages (temporary)

# One-off helper: saves two product pages and a GraphQL response so the
# product-detail fields can be designed offline. Remove once done.
on:
  push:
    paths:
      - .github/workflows/probe-pages.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          UA="HomeDecorEnterprisesCatalogSync/1.0"
          curl -sSL -A "$UA" --compressed -o probe/coffee.html "https://interio.com/product/acura-pro-engineered-wood-coffee-table-56121403SD00236"
          sleep 1
          curl -sSL -A "$UA" --compressed -o probe/bedside.html "https://interio.com/product/aero-particle-board-bedside-table-56101515SD00298"
          sleep 1
          Q='{products(filter:{sku:{in:["56121403SD00236","56101515SD00298"]}}){items{sku name url_key description{html} short_description{html} media_gallery{url label position disabled} ... on ConfigurableProduct{variants{product{sku name}}} }}}'
          curl -sSL -A "$UA" --compressed -G --data-urlencode "query=$Q" -o probe/graphql.json "https://interio.com/graphql" || true
          ls -la probe
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add probe
          git commit -m "Add temporary sample pages" || exit 0
          git push
