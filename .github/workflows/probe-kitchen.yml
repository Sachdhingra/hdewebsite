name: Save Interio kitchen range photos (temporary)

# One-off helper: saves the kitchen range pages and their banner photos, and
# test-parses the kitchen sets. Remove once done.
on:
  push:
    paths:
      - .github/workflows/probe-kitchen.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for f in Steel_Chef_2 Steel_Chef_3 Willow_Wok_2 Willow_Wok_3 Flavours_2 Flavours_3; do
            curl -sSL -A "$UA" -o "probe/$f.jpg" -w "%{http_code} %{size_download} $f\n" "https://interio.com/media/wysiwyg/$f.jpg" || true
            sleep 1
          done
          file probe/*
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add probe
          git commit -m "Add temporary kitchen range pages" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
