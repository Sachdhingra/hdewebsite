name: Save Interio kitchen pages (temporary)

# One-off helper: saves Interio's modular kitchen pages so their banner photos
# can be found. Remove once done.
on:
  push:
    paths:
      - .github/workflows/probe-kitchen.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          i=0
          for u in "https://interio.com/" "https://interio.com/modular-kitchen" "https://interio.com/modular-kitchens" "https://interio.com/kitchen" "https://interio.com/home-furniture/modular-kitchen" "https://interio.com/modular-kitchen-design" "https://interio.com/kitchens"; do
            i=$((i+1))
            curl -sSL -A "$UA" --compressed -o "probe/p$i.html" -w "$i %{http_code} %{size_download} %{url_effective}\n" "$u" >> probe/index.txt || true
            sleep 1
          done
          cat probe/index.txt
          grep -ohiE 'https?://[^"'"'"' )]+kitchen[^"'"'"' )]*\.(jpe?g|png|webp)[^"'"'"' )]*' probe/*.html | sort -u > probe/kitchen_images.txt || true
          grep -ohiE 'href="[^"]*kitchen[^"]*"' probe/*.html | sort -u > probe/kitchen_links.txt || true
          wc -l probe/*.txt
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add probe
          git commit -m "Add temporary kitchen pages" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
