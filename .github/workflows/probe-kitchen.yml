name: Save Interio kitchen photos (temporary)

# One-off helper: downloads Interio's modular kitchen banner photos so an HDE
# kitchen banner can be built from them. Remove once done.
on:
  push:
    paths:
      - .github/workflows/probe-kitchen.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for p in wysiwyg/Kitchen_Desktop_1.jpg wysiwyg/Kitchen_Mobile.jpg wysiwyg/Modular_Kitchen_MK.jpg wysiwyg/Kitchen_design_expert_1_1_.jpg wysiwyg/Kitchens-updated/Steel_Chef.jpg wysiwyg/Kitchens-updated/Willow_Wok.jpg wysiwyg/Kitchens/Flavours.jpg wysiwyg/modular-kitchen-contact_1.jpg wysiwyg/modular-kitchen-getinspired_1.jpg .renditions/wysiwyg/Kitchens/7.jpg .renditions/wysiwyg/Kitchens/8.jpg catalog/product/k/i/kitchenmodel01_a2_413x440.jpg catalog/product/k/i/kitchenmodel03_a2_413x440.jpg catalog/product/k/i/kitchenmodel04_a2_413x440.jpg; do
            out="probe/$(echo "$p" | tr '/' '_')"
            curl -sSL -A "$UA" -o "$out" -w "%{http_code} %{size_download} $p\n" "https://interio.com/media/$p" || true
            sleep 1
          done
          file probe/*
      - name: Commit
        run: |
          git config user.name "hde-catalog-bot"
          git config user.email "hde-catalog-bot@users.noreply.github.com"
          git add probe
          git commit -m "Add temporary kitchen photos" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
